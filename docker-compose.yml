services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: youtube-trends-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: youtube_trends
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - youtube-trends-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dataset Initialization Service
  dataset-init:
    build:
      context: .
      dockerfile: Dockerfile.init
    container_name: youtube-trends-init
    restart: "no"
    environment:
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/youtube_trends?authSource=admin
      DATASET_PATH: /app/data/kaggle
    volumes:
      - ./data:/app/data
      - dataset_cache:/root/.cache
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - youtube-trends-network
    profiles:
      - init

  # Backend API Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: youtube-trends-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/youtube_trends?authSource=admin
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - youtube-trends-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # Frontend React App
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: youtube-trends-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_DEMO: "false"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - youtube-trends-network

  # MongoDB Web UI (Optional)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: youtube-trends-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - youtube-trends-network
    profiles:
      - tools

volumes:
  mongodb_data:
    driver: local
  dataset_cache:
    driver: local

networks:
  youtube-trends-network:
    driver: bridge

